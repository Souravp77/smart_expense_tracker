<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Smart Expense Tracker Pro{% endblock %}</title>

    <script>
        (function () {
            var savedMode = localStorage.getItem('themeMode') || localStorage.getItem('theme');
            var useDark = savedMode === 'dark';
            if (useDark) document.documentElement.classList.add('dark');
        })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css', v='20260220b') }}">
    {% block extra_head %}{% endblock %}
</head>

<body>
    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
    </div>

    <!-- Error Toast Container -->
    <div id="toastContainer" class="toast-stack" aria-live="polite" aria-atomic="true"></div>

    <!-- Main App Container -->
    <div id="appContainer" class="h-screen overflow-hidden">
        <div class="flex h-full">
            <div id="sidebarBackdrop" class="sidebar-backdrop" onclick="app.closeSidebar()"></div>
            <!-- Sidebar -->
            <aside id="appSidebar"
                class="app-sidebar w-72 bg-blue-950 text-white flex flex-col h-full border-r border-blue-900">
                <div class="p-6 border-b border-slate-800">
                    <div class="flex items-center justify-between gap-3">
                        <div class="flex items-center gap-3">
                            <div
                                class="w-10 h-10 bg-gradient-to-br from-blue-500 to-blue-700 rounded-xl flex items-center justify-center">
                                <i class="fas fa-chart-pie text-white"></i>
                            </div>
                            <div>
                                <h1 class="text-xl font-bold">ExpensePro</h1>
                                <p class="text-xs text-blue-200/80">Money Control Hub</p>
                            </div>
                        </div>
                        <button id="sidebarCloseBtn" onclick="app.closeSidebar()"
                            class="lg:hidden p-2 text-blue-200/80 hover:text-white hover:bg-white/10 rounded-lg transition-all"
                            title="Close menu">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                </div>

                <nav class="flex-1 p-4 space-y-1 overflow-y-auto">
                    <button onclick="app.navigate('dashboard')"
                        class="nav-item active w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all text-left text-white"
                        id="nav-dashboard">
                        <i class="fas fa-th-large w-5"></i>
                        <span class="font-medium">Dashboard</span>
                    </button>

                    <button onclick="app.navigate('transactions')"
                        class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all text-left text-blue-200/80 hover:text-white hover:bg-white/10"
                        id="nav-transactions">
                        <i class="fas fa-wallet w-5"></i>
                        <span class="font-medium">Transactions</span>
                    </button>

                    <button onclick="app.navigate('savings')"
                        class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all text-left text-blue-200/80 hover:text-white hover:bg-white/10"
                        id="nav-savings">
                        <i class="fas fa-piggy-bank w-5"></i>
                        <span class="font-medium">Savings Goals</span>
                    </button>

                    <button onclick="app.navigate('analytics')"
                        class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all text-left text-blue-200/80 hover:text-white hover:bg-white/10"
                        id="nav-analytics">
                        <i class="fas fa-chart-line w-5"></i>
                        <span class="font-medium">Analytics</span>
                    </button>

                    <button onclick="app.navigate('settings')"
                        class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all text-left text-blue-200/80 hover:text-white hover:bg-white/10"
                        id="nav-settings">
                        <i class="fas fa-cog w-5"></i>
                        <span class="font-medium">Settings</span>
                    </button>
                </nav>

                <div class="p-4 border-t border-blue-900/70">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-gradient-to-br from-blue-400 to-blue-600 flex items-center justify-center text-white font-bold"
                                id="sidebarAvatar">
                                U
                            </div>
                            <div>
                                <p class="text-sm font-semibold text-white" id="sidebarName">Loading...</p>
                                <p class="text-xs text-blue-200/80" id="sidebarEmail">...</p>
                            </div>
                        </div>
                        <button onclick="app.logout()"
                            class="p-2 text-blue-200/80 hover:text-white hover:bg-white/10 rounded-lg transition-all"
                            title="Logout">
                            <i class="fas fa-sign-out-alt"></i>
                        </button>
                    </div>
                </div>
            </aside>

            <main class="flex-1 flex flex-col h-full overflow-hidden bg-slate-50 dark:bg-slate-950"
                style="background-image: radial-gradient(circle at 10% 0%, rgba(219, 234, 254, 0.55), rgba(219, 234, 254, 0) 36%), radial-gradient(circle at 92% 96%, rgba(191, 219, 254, 0.45), rgba(191, 219, 254, 0) 40%);">
                <header class="glass px-4 md:px-8 py-4 flex items-center justify-between gap-4">
                    <div>
                        <div class="flex items-center gap-3">
                            <button id="sidebarOpenBtn" onclick="app.toggleSidebar()"
                                class="lg:hidden p-2 text-slate-500 hover:text-slate-700 dark:text-slate-300 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-all">
                                <i class="fas fa-bars"></i>
                            </button>
                            <h2 id="pageTitle" class="text-2xl font-bold text-slate-900 dark:text-white">Dashboard</h2>
                        </div>
                        <p id="greeting" class="text-sm text-slate-500 dark:text-slate-400 mt-1">Welcome back!</p>
                    </div>

                    <div class="flex items-center gap-2 md:gap-4">
                        <span id="currentDate"
                            class="hidden md:inline-flex text-sm font-medium text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-800 px-4 py-2 rounded-lg">
                            Loading...
                        </span>

                        <button onclick="app.toggleTheme()"
                            class="p-2 text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-all">
                            <i class="fas fa-moon" id="themeIcon"></i>
                        </button>

                        <button onclick="app.openAddTransactionModal()" class="btn-primary">
                            <i class="fas fa-plus"></i>
                            <span class="hidden md:inline">Add Transaction</span>
                            <span class="md:hidden">Add</span>
                        </button>
                    </div>
                </header>

                <div id="appContent" class="flex-1 overflow-y-auto p-8">
                    {% block app_content %}{% endblock %}
                </div>
            </main>
        </div>
    </div>

    <!-- Modals -->
    <!-- Transaction Modal -->
    <div id="transactionModal" class="modal-overlay">
        <div class="modal-container">
            <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-2xl overflow-hidden">
                <div
                    class="px-6 py-4 border-b border-slate-200 dark:border-slate-800 flex justify-between items-center">
                    <h3 id="txModalTitle" class="text-lg font-bold text-slate-900 dark:text-white">Add Transaction</h3>
                    <button onclick="modal.close()"
                        class="p-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg">
                        <i class="fas fa-times"></i>
                    </button>
                </div>

                <div id="txModalError" class="error-message mx-6 mt-4">
                    <i class="fas fa-exclamation-circle"></i>
                    <span id="txModalErrorText"></span>
                </div>

                <form id="transactionForm" class="p-6 space-y-5">
                    <input type="hidden" name="txId" id="txId">
                    <input type="hidden" name="goalId" id="txGoalId">

                    <div class="flex gap-2 p-1 bg-slate-100 dark:bg-slate-800 rounded-xl">
                        <label class="flex-1 cursor-pointer">
                            <input type="radio" name="type" value="expense" class="peer hidden" checked>
                            <div
                                class="text-center py-2.5 text-sm font-semibold rounded-lg transition-all peer-checked:bg-white dark:peer-checked:bg-slate-700 peer-checked:text-red-600 dark:peer-checked:text-red-300 text-slate-500 dark:text-slate-400">
                                <i class="fas fa-arrow-down mr-1"></i> Expense
                            </div>
                        </label>
                        <label class="flex-1 cursor-pointer">
                            <input type="radio" name="type" value="income" class="peer hidden">
                            <div
                                class="text-center py-2.5 text-sm font-semibold rounded-lg transition-all peer-checked:bg-white dark:peer-checked:bg-slate-700 peer-checked:text-green-600 dark:peer-checked:text-green-300 text-slate-500 dark:text-slate-400">
                                <i class="fas fa-arrow-up mr-1"></i> Income
                            </div>
                        </label>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Amount</label>
                        <div class="relative">
                            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 font-medium"
                                id="modalCurrencySymbol"></span>
                            <input type="number" name="amount" id="txAmount" required min="0.01" step="0.01"
                                class="form-input pl-8" placeholder="0.00">
                        </div>
                    </div>

                    <div id="categoryContainer">
                        <label
                            class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Category</label>
                        <select name="category" id="txCategory" class="form-input" required>
                            <option value="">Select a category</option>
                            <optgroup label="Expense Categories">
                                <option value="Food & Dining">Food & Dining</option>
                                <option value="Transportation">Transportation</option>
                                <option value="Shopping">Shopping</option>
                                <option value="Entertainment">Entertainment</option>
                                <option value="Bills & Utilities">Bills & Utilities</option>
                                <option value="Healthcare">Healthcare</option>
                                <option value="Education">Education</option>
                                <option value="Other Expense">Other</option>
                            </optgroup>
                            <optgroup label="Income Categories">
                                <option value="Salary">Salary</option>
                                <option value="Freelance">Freelance</option>
                                <option value="Investment">Investment</option>
                                <option value="Gift">Gift</option>
                                <option value="Other Income">Other</option>
                            </optgroup>
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label
                                class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Description</label>
                            <input type="text" name="description" id="txDescription" required class="form-input"
                                placeholder="e.g., Grocery shopping">
                        </div>
                        <div>
                            <label
                                class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Date</label>
                            <input type="date" name="date" id="txDate" required class="form-input">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Payment
                            Method</label>
                        <select name="method" id="txMethod" class="form-input">
                            <option value="Cash">Cash</option>
                            <option value="Card">Credit/Debit Card</option>
                            <option value="Bank Transfer">Bank Transfer</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="flex gap-3 pt-4">
                        <button type="button" onclick="modal.close()" class="btn-secondary flex-1">Cancel</button>
                        <button type="submit" class="btn-primary flex-1">Save Transaction</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Goal Modal -->
    <div id="goalModal" class="modal-overlay">
        <div class="modal-container">
            <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-2xl overflow-hidden">
                <div
                    class="px-6 py-4 border-b border-slate-200 dark:border-slate-800 flex justify-between items-center">
                    <h3 id="goalModalTitle" class="text-lg font-bold text-slate-900 dark:text-white">Add Savings Goal
                    </h3>
                    <button onclick="goalModal.close()"
                        class="p-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg">
                        <i class="fas fa-times"></i>
                    </button>
                </div>

                <div id="goalModalError" class="error-message mx-6 mt-4">
                    <i class="fas fa-exclamation-circle"></i>
                    <span id="goalModalErrorText"></span>
                </div>

                <form id="goalForm" class="p-6 space-y-5">
                    <input type="hidden" name="goalId" id="goalId">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Goal
                            Name</label>
                        <input type="text" name="name" required class="form-input" placeholder="e.g., New Laptop">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Target
                                Amount</label>
                            <div class="relative">
                                <span
                                    class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 font-medium modal-currency-symbol"></span>
                                <input type="number" name="target" required min="1" step="0.01" class="form-input pl-8"
                                    placeholder="0.00">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Current
                                Saved</label>
                            <div class="relative">
                                <span
                                    class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 font-medium modal-currency-symbol"></span>
                                <input type="number" name="current" required min="0" step="0.01" class="form-input pl-8"
                                    placeholder="0.00">
                            </div>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Color
                            Theme</label>
                        <select name="color" class="form-input">
                            <option value="bg-blue-500">Blue</option>
                            <option value="bg-sky-500">Sky</option>
                            <option value="bg-indigo-500">Indigo</option>
                            <option value="bg-cyan-500">Cyan</option>
                            <option value="bg-blue-700">Deep Blue</option>
                        </select>
                    </div>

                    <div class="flex gap-3 pt-4">
                        <button type="button" onclick="goalModal.close()" class="btn-secondary flex-1">Cancel</button>
                        <button type="submit" class="btn-primary flex-1">Save Goal</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        window.APP_CONFIG = {
            logoutUrl: "{{ url_for('auth.logout') }}",
            initialTab: "{{ initial_tab or 'dashboard' }}"
        };
    </script>
    <script type="module" src="{{ url_for('static', filename='js/dashboard.js', v='20260220b') }}"></script>
    {% block extra_scripts %}{% endblock %}
</body>

</html>
